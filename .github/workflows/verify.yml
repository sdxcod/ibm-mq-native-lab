name: Verify native MQ lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./mvnw -B -ntp verify
  mq-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./scripts/init-lab.sh
      - run: docker compose up -d --wait --wait-timeout 360 mq
      - run: ./mvnw -B -ntp -Pmq-it verify
      - if: failure()
        run: docker compose logs mq
      - if: always()
        run: docker compose down
